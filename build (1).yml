name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar archivos en sus carpetas (por si se subieron sueltos)
        run: |
          J=src/main/java/com/corazondemelon
          A=src/main/resources/assets/corazondemelon
          place() {
            if [ -f "$1" ]; then mkdir -p "$2"; mv "$1" "$2/"; echo "movido $1 -> $2/"; fi
          }
          for f in CorazonDeMelon MelonConfig; do place $f.java $J; done
          for f in MaoActions MaoBrain MaoIntents MaoMods MaoPlaces; do place $f.java $J/ai; done
          for f in ClientEvents ClientSetup InnocenceOverlay MaoModel MaoRenderer MelonConfigScreen; do place $f.java $J/client; done
          place MelonCommands.java $J/command
          place MaoEntity.java $J/entity
          for f in HeartSpawner InnocenceEvents MobReactions; do place $f.java $J/event; done
          for f in ClientInnocenceData Innocence InnocenceNetwork; do place $f.java $J/innocence; done
          place HeartItem.java $J/item
          for f in ModEntities ModItems ModTabs; do place $f.java $J/registry; done
          place mods.toml src/main/resources/META-INF
          place pack.mcmeta src/main/resources
          place en_us.json $A/lang
          place es_es.json $A/lang
          for f in corazon_magico corazon_magico_azul corazon_magico_dorado corazon_magico_violeta mao_spawn_egg; do place $f.json $A/models/item; done
          for f in corazon_magico corazon_magico_azul corazon_magico_dorado corazon_magico_violeta; do place $f.png $A/textures/item; done
          place mao.png $A/textures/entity
          place mao_spawns.json src/main/resources/data/corazondemelon/forge/biome_modifier

      - name: Comprobar que el codigo esta en el repositorio
        run: |
          echo "Archivos en la raiz:"; ls -la
          test -f build.gradle || { echo "ERROR: no hay build.gradle en la raiz del repositorio"; exit 1; }
          test -d src/main/java || { echo "ERROR: falta la carpeta src/main/java"; exit 1; }
          echo "Archivos .java encontrados: $(find src/main/java -name '*.java' | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar el mod
        run: gradle build --no-daemon --stacktrace

      - name: Verificar que el .jar tiene el mod dentro
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Revisando $JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml' || { echo "ERROR: el jar no contiene mods.toml"; exit 1; }
          unzip -l "$JAR" | grep -q 'com/corazondemelon/CorazonDeMelon.class' || { echo "ERROR: el jar no contiene clases compiladas"; exit 1; }
          echo "OK: el jar contiene el mod"

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: corazon-de-melon
          path: build/libs/*.jar

      - name: Publicar release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
